<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product</title>
  <link href="https://fonts.googleapis.com/css2?family=BBH+Bartle&family=BBH+Bogle&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script> <!-- axios cdn for web -->
<!--product.css -->
<link rel="stylesheet" href="./product.css">
</head>
<body>
  <section id="nav-container"></section>
  <main class="product-detail" id="product-detail">
    <section class="img-area"><img src="https://placehold.co/600x500" alt=""></section>
    <section class="text-area">
      <div class="top">
        <h4 class="product-title">plantname</h4>
        <span class="product-price">price xxx  THB</span>
        <p class="product-description">Lorem ipsum dolor sit amet consectetur adipisicing elit. Magni velit odio dolor odit. Placeat molestias quis repudiandae accusamus in aspernatur blanditiis, laboriosam numquam sapiente commodi dicta architecto, nemo quae ex!</p>
      </div>
      <div class="bottom">
        <div class="quantity-area">
          <div class="quantity-box">
            <button class="qty-btn minus">-</button>
            <input type="number" class="qty-number"  value="1" min="1" max="5">
            <button class="qty-btn plus">+</button> 
          </div>
          <button class="btn add-cart">add to cart</button>
        </div>
        <button class="check-out">Check out</button>
      </div>

      </section>


    </main>
</body>
<script type="module" defer>
  import { components } from './product.js';
 import {initLoginRegister} from '../../../assets/js/loginRegister.js'
components.loadNav();
 initLoginRegister();
</script>
</html>
