<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Page</title>
  <link rel="stylesheet" href="/assets/css/myLoginModal.css">
  <link rel="stylesheet" href="productAll.css">
  <link rel="stylesheet" href="/Frontend/src/Components/Nav/nav.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <!-- JS modal -->
   
<script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script> <!-- axios cdn for web -->
</head>
<body>
  <section id="nav-container"></section>

<section class="container-area">
  <aside class="filter-product">
    <div class="category">
      <label for="">Category</label>
      <ul>
        <li><input type="checkbox" value="Indoor Plants" id="Indoor Plants"><label for="Indoor Plants">Indoor Plants</label></li>
        <li><input type="checkbox" value="Partial Shade"  id="Partial Shade"><label for="Partial Shade">Partial Shade</label></li>
        <li><input type="checkbox"value="Sun-loving plants" id="Sun-loving plants"><label for="Sun-loving plants">Sun-loving plants</label></li>
      </ul>
      </div>
      <div class="price-range-area">
        <!-- ดึงค่า max -->
        <label for="price-range">Price</label>
        <div class="range-slider">
          <span class="slider-track"></span>
          <input type="range" name="min_val" id="price-range" min="0" max="5000" value="50" >
          <input type="range" name="max_val" id="price-range" min="0" max="5000" value="2000">
        </div>
        
        <div class="price-input">
          <div class="inputBox-left" ><input type="text" id="input-left" style="width: 20px;" ><span>THB</span></div>
          <div class="inputBox-right" ><input type="text" id="input-right" style="width: 20px;"><span>THB</span></div>
        </div>
      </div>
      <!-- price dynamic ref:w3school -->
      <div class="chose-product">
        
          <select name="product" id="viewList">
            <option value="3" selected>3</option>
            <option value="6">6</option>
          </select>
          <button type="submit">Filter</button>
</div>
  </aside>
  <section class="product-display" id="product-display">
    <!-- search input -->
<div id="product-container" class="product-container">
  <!-- loop plant product -->
</div>

<div class="pagination-btn">
  <button id="btn-prev" >prev</button>
  <!-- ตัวเลข -->
  <button id="btn-next" >Next</button>
</div>
  </section>
</section>
  
</body>


<script type="module">
import { loadNav,loadProduct ,setupPagination,selectShow} from "./productAll.js";
loadNav();
loadProduct();
setupPagination();
const viewList = document.getElementById("viewList");

selectShow();
</script>
</html>
