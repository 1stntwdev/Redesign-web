<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart</title>
  <link rel="stylesheet" href="/Frontend/src/assets/css/myLoginModal.css"><!-- JS modal -->
  <link rel="stylesheet" href="/Frontend/src/Components/Nav/nav.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script> <!-- axios cdn for web -->
  <script src="./cart.js" type="module" defer></script>
  <link rel="stylesheet"  href="./cart.css">
  <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script> <!-- axios cdn for web -->

</head>
<body>
<section id="nav-container"></section>
<header>cart -> Shipping -> Payment</header>
<h4>My cart.</h4>
<section class="cart-area">
  <aside class="list-item">
   
   

  </aside>
  <section class="order-area">
    <h4>Order Summary</h4>
    <br>
    <h4>Sub Total</h4>
    <div class="Subtotal"><p>Subtotal: <span class="subTotal-number"> THB</span></p></div>   
    <div class="Subtotal"><p>Vat (7%): <span class="vat-number">20 THB(7%)</span></p></div>   
    <div class="shipping"><p>Shipping: <span>200 THB</span> (Flat rate)</p></div>   
    <div class="Total"><p>Total <span class="total-payment">1000</span></p></div>   
    <button class="btn-checkout">Process To Checkout</button>
  </section>
</section>

</body>
<script type="module">
import {initAuthNav} from '/Frontend/src/assets/js/authNav.js'
