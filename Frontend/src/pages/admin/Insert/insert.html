    <div class="sub-header">
       <h1>Insert New Product</h1> 
       <button type="submit" form="form-grid">Add Product</button>
    </div>
<!--BACKLOG เปลี่ยน เปลี่ยน onclick ให้รีโหลดหน้า -->
    <form class="form-grid" id="form-grid"  enctype="multipart/form-data">
      <section class="naming-details">
        <h3>Insert General Information</h3>
      <label for="name" >Product Name<input type="text" name="name" id="name" required></label>
      <label for="description" >Description<textarea type="text" id="description" name="description"></textarea></label>
      <label for="high">high size<input type="number" name="high" id="high"></label>
      <label for="wide">pot size<input type="number" name="wide" id="wide"></label>
      <label for="amount">amount<input type="number" name="amount" id="amount" required></label>
      </section>
      <section class="pricing-details">
        <h3>Price</h3>
      <label for="price">Base Price<input type="number" id="price" name="price" required></label>
      </section>
      <section class="media-details">
        <h3>Product Media</h3>
        <div class="img-details">
          <input type="file" id="product_pic" name="photo">
        </div>
      </section>
      <section class="category-details"><h3>Category</h3>
        <select name="category" id="category">
          <option value="Category" disabled selected>Category</option>
          <option value="Indoor Plants">Indoor Plants</option>
          <option value="Partial Shade">Partial Shade</option>
          <option value="Sun-loving plants">Sun-loving plants</option>
        </select>
      </section>
    </form>
